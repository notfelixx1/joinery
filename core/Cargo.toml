[package]
name = "joinery-tools"
version = "0.1.0"
description = "Joinery Tools — one app. Everyday tools. No nonsense."
authors = ["Joinery Tools contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joinery-tools/joinery-tools"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

rusqlite = { version = "0.32", features = ["bundled"] }

sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

walkdir = "2"
similar = "2"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"
