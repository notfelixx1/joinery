[package]
name = "joinery-tools"
version = "0.1.0"
description = "Joinery Tools — one app. Everyday tools. No nonsense."
authors = ["notfelixx1"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/notfelixx1/joinery"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

rusqlite = { version = "0.32", features = ["bundled"] }

sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

walkdir = "2"
imara-diff = "0.2"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
