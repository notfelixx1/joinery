name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --color never

  audit:
    # Advisory database check on every push/PR: known CVEs in the
    # dependency tree fail the build (cargo audit exits non-zero on
    # vulnerabilities; unmaintained/unsound warnings do not fail).
    # Runs once, not per-OS. The cargo audit CLI is used instead of
    # the rustsec/audit-check action, whose check-run API calls fail
    # intermittently with "Not Found".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Security audit
        run: cargo install cargo-audit --locked && cargo audit
