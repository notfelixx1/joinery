name: Release

# Builds release binaries for all three platforms and attaches them to a
# GitHub Release. Trigger: push a tag like v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --color never

      - name: Build release binary
        run: cargo build --release -p joinery

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/joinery.exe -DestinationPath joinery-${{ runner.os }}.zip

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar czf joinery-${{ runner.os }}.tar.gz -C target/release joinery

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            joinery-*.zip
            joinery-*.tar.gz
